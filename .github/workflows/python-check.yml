name: Python checks
on:
  push:
    branches: [main, feature/admin-panel-v2]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q bot-searchSpide.py dashboard
      - run: pytest -q
