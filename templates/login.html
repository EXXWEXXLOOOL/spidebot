<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpideBot • Вход</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a170d,#090a0c 55%);color:#f4f4f4;font-family:Inter,sans-serif;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));padding:34px;background:#12151a;border:1px solid #2b3038;border-radius:22px;box-shadow:0 24px 90px #0009}.logo{font-size:28px;font-weight:800;letter-spacing:2px}.orange{color:#ff8738}.muted{color:#929aa6;font-size:12px}.field{width:100%;padding:13px;margin-top:8px;background:#090b0e;border:1px solid #303640;border-radius:10px;color:white;outline:none}.field:focus{border-color:#ff8738}button{width:100%;padding:13px;background:#ff8738;border:0;border-radius:10px;font-weight:800;margin-top:20px;cursor:pointer}.error{color:#ff9b80;font-size:12px;margin-top:14px}.note{background:#35220f;color:#ffc27c;border-radius:10px;padding:12px;font-size:12px;margin-top:14px}</style></head><body><main class="card"><div class="logo">🕷 SPIDE<span class="orange">BOT</span></div><p class="muted">CONTROL CENTER · ADMIN AUTHENTICATION</p><h1 style="font-size:22px;margin-top:30px">Вход в панель</h1>{% if not configured %}<div class="note">Не заданы ADMIN_USERNAME и ADMIN_PASSWORD. Настройте переменные окружения перед входом.</div>{% endif %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><label class="muted">Логин</label><input class="field" name="username" autocomplete="username" required><label class="muted" style="display:block;margin-top:16px">Пароль</label><input class="field" type="password" name="password" autocomplete="current-password" required><button type="submit">ВОЙТИ</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}</main></body></html>
